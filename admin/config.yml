# Upload portals for jamiederooij.com (open /portal for the three links)
# Every save commits to the GitHub repo; the host then republishes the site (about a minute).

backend:
  name: github
  repo: JamiedeRooij/jamie-de-rooij
  branch: main

# Testing on your own computer: run `npx decap-server` in the site folder,
# then open http://localhost:8080/admin — no login needed.
local_backend: true

publish_mode: simple
media_folder: uploads
public_folder: uploads

site_url: https://www.jamiederooij.com
display_url: https://www.jamiederooij.com

collections:
  # ---------- Portal 1: poster trail ----------
  - name: trail
    label: "Poster trail"
    description: "Posters that follow the cursor over your name in the hero. They appear in this order."
    files:
      - name: trail
        label: "Poster trail"
        file: content/trail.json
        format: json
        fields:
          - name: posters
            label: "Posters"
            label_singular: "Poster"
            widget: list
            summary: "{{fields.image}}"
            fields:
              - { name: image, label: "Poster", widget: image, choose_url: true }

  # ---------- Portal 2: poster wall ----------
  - name: wall
    label: "Poster wall"
    description: "Posters in the poster wall. New ones slide in from the right."
    files:
      - name: wall
        label: "Poster wall"
        file: content/wall.json
        format: json
        fields:
          - name: posters
            label: "Posters"
            label_singular: "Poster"
            widget: list
            summary: "{{fields.image}}"
            fields:
              - { name: image, label: "Poster", widget: image, choose_url: true }

  # ---------- Portal 3: works ----------
  - name: works
    label: "Works"
    description: "The masonry grid. Press 'Add work' and choose Image, Video or Slideshow."
    files:
      - name: works
        label: "Works"
        file: content/works.json
        format: json
        fields:
          - name: works
            label: "Works"
            label_singular: "work"
            widget: list
            typeKey: type
            types:
              - name: image
                label: "Image"
                widget: object
                summary: "{{fields.title}} · image"
                fields:
                  - { name: title, label: "Title", widget: string, hint: "Shown on hover and in the lightbox." }
                  - { name: image, label: "Image", widget: image, choose_url: true }
                  - { name: description, label: "Description", widget: text, required: false, hint: "Shown in the lightbox, bottom middle." }
                  - { name: url, label: "URL (optional)", widget: string, required: false, hint: "Adds a 'Visit project' link in the lightbox." }
                  - { name: profession, label: "Profession", widget: string, required: false, hint: "e.g. Art direction, Poster, Branding. Shown bottom right in the lightbox." }
              - name: video
                label: "Video"
                widget: object
                summary: "{{fields.title}} · video"
                fields:
                  - { name: title, label: "Title", widget: string, hint: "Shown on hover and in the lightbox." }
                  - { name: video, label: "Video (mp4)", widget: file, choose_url: true, hint: "Plays muted in the grid, with sound in the lightbox. Keep it short and compressed." }
                  - { name: image, label: "Still image (optional)", widget: image, required: false, choose_url: true, hint: "Shown while the video loads." }
                  - { name: description, label: "Description", widget: text, required: false, hint: "Shown in the lightbox, bottom middle." }
                  - { name: url, label: "URL (optional)", widget: string, required: false, hint: "Adds a 'Visit project' link in the lightbox." }
                  - { name: profession, label: "Profession", widget: string, required: false, hint: "e.g. Art direction, Poster, Branding. Shown bottom right in the lightbox." }
              - name: slideshow
                label: "Slideshow"
                widget: object
                summary: "{{fields.title}} · slideshow"
                fields:
                  - { name: title, label: "Title", widget: string, hint: "Shown on hover and in the lightbox." }
                  - name: slides
                    label: "Slides"
                    label_singular: "slide"
                    widget: list
                    min: 2
                    hint: "The first slide sets the size of the card."
                    field: { name: image, label: "Image", widget: image, choose_url: true }
                  - { name: description, label: "Description", widget: text, required: false, hint: "Shown in the lightbox, bottom middle." }
                  - { name: url, label: "URL (optional)", widget: string, required: false, hint: "Adds a 'Visit project' link in the lightbox." }
                  - { name: profession, label: "Profession", widget: string, required: false, hint: "e.g. Art direction, Poster, Branding. Shown bottom right in the lightbox." }
