<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamie de Rooij</title>
<meta name="description" content="Jamie de Rooij — Dutch graphic designer working at the intersection of creativity, research and experimentation.">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HERO: fixed behind the page; the sections below scroll over it -->
<header class="hero" id="hero">
  <div class="trail" id="trail" aria-hidden="true"></div>
  <h1 class="hero-name"><span id="heroName">Jamie</span></h1>
</header>
<div class="hero-spacer" aria-hidden="true"></div>

<main class="page">
  <section class="section works" id="work">
    <div class="section-head">
      <h2 class="h2">Selected Works</h2>
    </div>
    <div class="masonry" id="masonry" aria-live="polite"></div>
  </section>

  <section class="section wall" id="posters">
    <div class="section-head">
      <h2 class="h2">Poster Wall</h2>
    </div>
    <div class="ticker" id="ticker">
      <div class="ticker-track" id="tickerTrack"></div>
    </div>
  </section>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Project" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <div class="lightbox-inner" id="lightboxInner">
    <div class="lightbox-media" id="lightboxMedia"></div>
    <div class="lightbox-text">
      <p class="lb-title" id="lbTitle"></p>
      <p class="lb-sub" id="lbSub"></p>
      <p class="lb-desc" id="lbDesc"></p>
    </div>
  </div>
</div>

<script src="main.js" defer></script>
</body>
</html>
