# After an upload through the portal:
#  1. shrink any video that is too big for Cloudflare (over 20 MB),
#  2. make web-sized copies of every new image and a still for every video,
#     and record their sizes in public/content/media.json,
# then commit the result. Cloudflare publishes the site with it.
name: Prepare uploads

on:
  push:
    branches: [main]
    paths: ["public/uploads/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-uploads
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade pillow

      - name: Compress videos over 20 MB
        run: bash tools/compress-videos.sh

      - name: Make web-sized copies
        run: python3 tools/optimize-media.py

      - name: Commit
        run: |
          git add -A public/uploads public/content
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git config user.name "Upload helper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare uploads: web-sized copies and sizes"
          git pull --rebase origin main
          git push
